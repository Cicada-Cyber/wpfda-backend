spring:
  application:
    name: wpfda-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wpfda}
    username: ${DB_USERNAME:wpfda}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${PORT:8080}
