name: Bug report
description: The API, database or an import is behaving incorrectly
title: "Bug: "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Before you start
      options:
        - label: I have searched existing issues for this problem
          required: true
        - label: Logs and examples contain no personal information about members
          required: true
  - type: textarea
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Call `GET /api/…` with …
        2. Observe …
    validations:
      required: true
  - type: textarea
    attributes:
      label: Relevant logs or response
      description: Paste the response body or stack trace. Redact tokens and member data.
      render: text
  - type: input
    attributes:
      label: Version or commit
      placeholder: main @ abc1234, or the deployed environment
